# railway.toml — Configuração de deploy no Railway
# Docs: https://docs.railway.com/guides/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile.cloud"

[deploy]
# /liveness: retorna 200 assim que a JVM sobe (não depende de DB/Redis)
# Requer -Dmanagement.health.probes.enabled=true no CMD do Dockerfile
#healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
