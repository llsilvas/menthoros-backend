services:
  menthoros-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: menthoros-app
    environment:
      # Debug mode
      SPRING_PROFILES_ACTIVE: dev,docker
      # Database
      DB_HOST: menthoros-db
      DB_NAME: menthoros-db
      DB_USER: menthoros
      DB_PASSWORD: menthoros123
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      LOGGING_LEVEL_COM_MENTHOROS: DEBUG
      LOGGING_LEVEL_SQL: DEBUG
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SERVER_PORT: ${SERVER_PORT:-8099}

      # Hot reload
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: true

      # JVM Debug
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djava.security.egd=file:/dev/./urandom
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8099:8099"
      - "5005:5005"  # Debug port
      - "35729:35729" # LiveReload port
    volumes:
      # Mount source code para hot reload
      - ./src:/app/src:ro
      - ./pom.xml:/app/pom.xml:ro
#    depends_on:
#      - menthoros-db
    restart: "no" # Não reiniciar automaticamente em dev
    networks:
      - menthoros-network

  menthoros-db:
    image: pgvector/pgvector:pg17
    container_name: menthoros-db
    environment:
      # Configurações mais permissivas para desenvolvimento
      DB_HOST: localhost
      DB_USER: menthoros
      DB_PASSWORD: menthoros123
    ports:
      - "5433:5432" # Porta diferente para não conflitar
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init/menthoros_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d menthoros_dev"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - menthoros-network

  # Adminer para gerenciar banco de dados
#  adminer:
#    image: adminer
#    container_name: menthoros-adminer
#    restart: always
#    ports:
#      - "8081:8080"
#    depends_on:
#      - postgres
#    networks:
#      - menthoros-network

volumes:
  postgres_dev_data:

networks:
  menthoros-network:
    driver: bridge