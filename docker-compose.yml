# docker-compose.yml — Perfil LOCAL
# Sobe a infraestrutura (postgres, redis) + aplicação com hot reload via Maven
#
# Uso:
#   docker compose up           # inicia tudo
#   docker compose up postgres redis  # apenas infraestrutura
#
# Pré-requisito: arquivo .env com OPENAI_API_KEY definido

services:

  # ── PostgreSQL com extensão pgvector ────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: menthoros-db
    environment:
      POSTGRES_DB: ${DB_NAME:-menthoros}
      POSTGRES_USER: ${DB_USER:-menthoros}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-menthoros123}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init/menthoros_mt_init.sql:/docker-entrypoint-initdb.d/01-menthoros-init.sql:ro
      - ./src/main/resources/db/init/keycloak_init.sql:/docker-entrypoint-initdb.d/02-keycloak-init.sql:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=64MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-menthoros} -d ${DB_NAME:-menthoros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - menthoros-network

  # ── Redis (cache) ────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: menthoros-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - menthoros-network

  # Keycloak para autenticação e autorização
  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.5.4}
    container_name: menthoros-keycloak
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KC_PORT:-8080}:8080"
      - "${KC_MANAGEMENT_PORT:-9001}:9000"
    environment:
      # Admin credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin123}

      # Hostname configuration
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true

      # Database configuration (PostgreSQL)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${DB_USER:-menthoros}
      KC_DB_PASSWORD: ${DB_PASSWORD:-menthoros123}
      KC_DB_SCHEMA: public

      # Health and metrics
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Logging
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - menthoros-network

  # ── Aplicação Spring Boot (hot reload) ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    container_name: menthoros-app
    env_file:
      - .env
    environment:
      # Banco de dados (aponta para o serviço postgres, não localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-menthoros}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-menthoros}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-menthoros123}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis

      # JPA (modo desenvolvimento: DDL validate + SQL log ativo)
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Spring AI
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_AI_OPENAI_CHAT_MODEL: gpt-4o-mini
      SPRING_AI_OPENAI_EMBEDDING_MODEL: text-embedding-3-small

      # Perfil ativo
      SPRING_PROFILES_ACTIVE: local,docker

      # Spring DevTools
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"

      # Logging
      LOGGING_LEVEL_COM_MENTHOROS: DEBUG
      LOGGING_LEVEL_SQL: DEBUG
    ports:
      - "${SERVER_PORT:-8099}:8099"
      - "5005:5005"    # Debug JDWP (IDE remote debug)
      - "35729:35729"  # LiveReload (Spring DevTools)
    volumes:
      - ./src:/app/src:ro           # Hot reload: source code montado como volume
      - ./pom.xml:/app/pom.xml:ro   # Hot reload: pom atualizado sem rebuild
      - maven_cache:/root/.m2       # Cache do Maven entre restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: "no"  # Não reiniciar automaticamente em desenvolvimento
    networks:
      - menthoros-network

volumes:
  pg_data:
  redis_data:
  maven_cache:

networks:
  menthoros-network:
    name: menthoros-network    # Nome fixo sem prefixo de projeto — necessário para external: true no frontend
    driver: bridge
