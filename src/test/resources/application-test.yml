spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.flywaydb: WARN
    org.hibernate.SQL: WARN

app:
  strava:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/v1/strava/callback
    authorization-uri: https://www.strava.com/oauth/authorize
    token-uri: https://www.strava.com/oauth/token
    api-base-url: https://www.strava.com/api/v3
    webhook-verify-token: test-webhook-token
    sync-days-back: 90