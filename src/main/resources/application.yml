# ========================================
# SERVER CONFIGURATION
# ========================================
server:
  port: ${SERVER_PORT:8080}

# ========================================
# SPRING CORE CONFIGURATION
# ========================================
spring:
  application:
    name: menthoros-app

  # ---------------------------------------
  # Security
  # ---------------------------------------

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_URI}
  # ========================================
  # TASK SCHEDULING CONFIGURATION
  # ========================================

  task:
    scheduling:
      pool:
        size: 5  # Number of scheduler threads
      thread-name-prefix: "menthoros-scheduler-"
      shutdown:
        await-termination: true
        await-termination-period: 60s
  # ----------------------------------------
  # DATABASE CONFIGURATION
  # ----------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB:localhost}:${DB_PORT:5432}/${DB_NAME:menthoros-db}
    username: ${POSTGRES_USER:menthoros}
    password: ${POSTGRES_PASSWORD:menthoros123}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------
  # JPA/HIBERNATE CONFIGURATION
  # ----------------------------------------
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    properties:
      hibernate:
        format_sql: true    # formata SQL no console
    show-sql: false
    open-in-view: false    # evita manutenção de sessão aberta
    hibernate:
      ddl-auto: validate

  # ----------------------------------------
  # FLYWAY CONFIGURATION
  # ----------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: false


  # ----------------------------------------
  # AI/OPENAI CONFIGURATION
  # ----------------------------------------
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
          max-tokens: 12000
          top-p: 0.9
          frequency-penalty: 0.1
          presence-penalty: 0.0
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
# ========================================
# API DOCUMENTATION CONFIGURATION
# ========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ========================================
# APPLICATION SPECIFIC CONFIGURATION
# ========================================
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5174}

  # ----------------------------------------
  # OPENAPI DOCUMENTATION CONFIGURATION
  # ----------------------------------------
  openapi:
    title: Menthoros API
    description: API para gerenciar atletas, treinos e planejamento
    contact-name: Menthoros Team
    contact-email: contact@menthoros.com
    environment: ${SPRING_PROFILES_ACTIVE:dev}
  # ----------------------------------------
  # CACHE CONFIGURATION
  # ----------------------------------------
  cache:
    default-ttl: PT30M  # 30 minutes
    maximum-size: 1000

  # ----------------------------------------
  # CORS CONFIGURATION
  # ----------------------------------------
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # ----------------------------------------
  # LLM CONFIGURATION
  # ----------------------------------------
  llm:
    max-tokens: 4000
    temperature: 0.2
    timeout: 30000  # 30 seconds
    thread-pool:
      core-size: 2
      max-size: 5
      queue-capacity: 100

  # ----------------------------------------
  # IA SERVICE CONFIGURATION
  # ----------------------------------------
  ia:
    service:
      strategy: original  # enhanced | fixed | original

  # ----------------------------------------
  # SECURITY CONFIGURATION
  # ----------------------------------------
  security:
    public-paths:
      - "/api/public/**"
      - "/swagger-ui.html"
      - "/swagger-ui/**"
      - "/api-docs"
      - "/api-docs/**"
      - "/v3/api-docs"
      - "/v3/api-docs/**"
      - "/actuator/health"
    strava-paths:
      - "/api/v1/strava/webhook"
      - "/api/v1/strava/callback"

  # ----------------------------------------
  # STRAVA INTEGRATION CONFIGURATION
  # ----------------------------------------
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8099/api/strava/callback}
    authorization-uri: https://www.strava.com/oauth/authorize
    token-uri: https://www.strava.com/oauth/token
    api-base-url: https://www.strava.com/api/v3
    webhook-verify-token: ${STRAVA_WEBHOOK_TOKEN:}
    sync-days-back: ${STRAVA_SYNC_DAYS_BACK:90}



# ========================================
# LOGGING CONFIGURATION
# ========================================
logging:
  level:
    root: info
