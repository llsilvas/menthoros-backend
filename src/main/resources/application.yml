# ========================================
# SERVER CONFIGURATION
# ========================================
server:
  port: ${SERVER_PORT:8080}

# ========================================
# SPRING CORE CONFIGURATION
# ========================================
spring:
  application:
    name: menthoros-app

  # ----------------------------------------
  # DATABASE CONFIGURATION
  # ----------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:menthoros-db}
    username: ${DB_USER:menthoros}
    password: ${DB_PASSWORD:menthoros123}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------
  # JPA/HIBERNATE CONFIGURATION
  # ----------------------------------------
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    properties:
      hibernate:
        format_sql: true    # formata SQL no console
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false    # evita manutenção de sessão aberta
    hibernate:
      ddl-auto: update

  # ----------------------------------------
  # FLYWAY CONFIGURATION
  # ----------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  # ----------------------------------------
  # AI/OPENAI CONFIGURATION
  # ----------------------------------------
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
          max-tokens: 12000
          top-p: 0.9
          frequency-penalty: 0.1
          presence-penalty: 0.0
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
# ========================================
# API DOCUMENTATION CONFIGURATION
# ========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ========================================
# APPLICATION SPECIFIC CONFIGURATION
# ========================================
app:
  # ----------------------------------------
  # CACHE CONFIGURATION
  # ----------------------------------------
  cache:
    default-ttl: PT30M  # 30 minutes
    maximum-size: 1000

  # ----------------------------------------
  # CORS CONFIGURATION
  # ----------------------------------------
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # ----------------------------------------
  # LLM CONFIGURATION
  # ----------------------------------------
  llm:
    max-tokens: 4000
    temperature: 0.2
    timeout: 30000  # 30 seconds
    thread-pool:
      core-size: 2
      max-size: 5
      queue-capacity: 100

  # ----------------------------------------
  # IA SERVICE CONFIGURATION
  # ----------------------------------------
  ia:
    service:
      strategy: original  # enhanced | fixed | original

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging:
  level:
    root: info
