# Porta HTTP padrão
server:
  port: ${SERVER_PORT:8099}

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Cache Configuration
app:
  cache:
    default-ttl: PT30M  # 30 minutes
    maximum-size: 1000
  # LLM Configuration

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  llm:
    max-tokens: 4000
    temperature: 0.2
    timeout: 30000  # 30 seconds
    thread-pool:
      core-size: 2
      max-size: 5
      queue-capacity: 100

  # IA Service Configuration
  ia:
    service:
      strategy: original  # enhanced | fixed | original

spring:
  application:
    name: menthoros-services
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-4o
#          temperature: 0.2
#          max-tokens: 4000
#          top-p: 0.9
#          frequency-penalty: 0.1
#          presence-penalty: 0.0
#      embedding:
#        options:
#          model: text-embedding-3-small
#          dimensions: 1536

  # Configurações JPA comuns
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    properties:
      hibernate:
        format_sql: true    # formata SQL no console
    show-sql: false
    open-in-view: false    # evita manutenção de sessão aberta
    hibernate:
      ddl-auto: update

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:menthoros}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

logging:
  level:
    root: info
