<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo lead qualificado na waitlist</title>
</head>
<body style="margin:0;padding:0;background-color:#E9ECF1;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#E9ECF1;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="480" cellspacing="0" cellpadding="0" border="0" align="center" style="width:480px;max-width:480px;background-color:#FFFFFF;border-radius:12px;">
          <tr>
            <td style="padding:28px 32px 0 32px;font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#5C7A00;">
              Waitlist · Lead qualificado
            </td>
          </tr>
          <tr>
            <td style="padding:10px 32px 0 32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#0B1220;">
              {{nome}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 0 32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#2B3442;">
              <strong>E-mail:</strong> {{email}}<br>
              <strong>Atletas:</strong> {{faixaAtletas}}<br>
              <strong>WhatsApp:</strong> {{telefone}}<br>
              <strong>Origem:</strong> {{origem}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px 32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5F6875;">
              Lead treinador recém-criado na waitlist. Responder rápido enquanto o interesse está quente.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
