# =====================================================================
# Fonte ÚNICA de preços LLM (RISK-02) — consumida por LlmPricingRegistry.
#
# NÃO duplicar estes valores em Javadoc, código ou docs; o guia de uso
# (docs/llm-pricing-guide.md no workspace) apenas referencia este arquivo.
#
# Valores em USD por MTok (1 milhão de tokens).
#   input-per-mtok        — tokens de entrada (sem cache)
#   cached-input-per-mtok — cache read hit
#   cache-write-per-mtok  — cache write (Anthropic; TTL 1h = 2x input)
#   output-per-mtok       — tokens de saída
#
# Referências oficiais:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
# =====================================================================
vigencia: 2026-11

modelos:
  # Sucessor do gpt-4o (migrate-openai-retired-models). Faixa standard, contexto <= 272K tokens;
  # acima disso a OpenAI cobra mais (input 0.20, cached 0.02, output 0.75). Tokens de reasoning
  # saem como output. A resposta traz o nome do modelo servido; se vier com sufixo de snapshot,
  # acrescentar a entrada com os mesmos valores (o CostTrackingAdvisor busca pelo nome exato).
  gpt-6-luna:
    input-per-mtok: 0.10
    cached-input-per-mtok: 0.01
    output-per-mtok: 0.50
  # Segundo candidato do bake-off. O snapshot datado é o nome que a resposta devolve; a página de
  # preços lista só o gpt-5.2, então o snapshot repete os valores dele.
  gpt-5.2:
    input-per-mtok: 1.75
    cached-input-per-mtok: 0.175
    output-per-mtok: 14.00
  gpt-5.2-2025-12-11:
    input-per-mtok: 1.75
    cached-input-per-mtok: 0.175
    output-per-mtok: 14.00
  gpt-4o-mini:
    input-per-mtok: 0.15
    cached-input-per-mtok: 0.075
    output-per-mtok: 0.60
  # Snapshot datado: é o nome que a OpenAI devolve na resposta para chamadas a gpt-4o-mini, e o
  # CostTrackingAdvisor busca o preço por esse nome exato. Mesmos valores de gpt-4o-mini.
  gpt-4o-mini-2024-07-18:
    input-per-mtok: 0.15
    cached-input-per-mtok: 0.075
    output-per-mtok: 0.60
  gpt-4o:
    input-per-mtok: 2.50
    cached-input-per-mtok: 1.25
    output-per-mtok: 10.00
  # Snapshot datado que a OpenAI devolve para chamadas a gpt-4o (rotas plano e expert). Mesmos
  # valores de gpt-4o.
  gpt-4o-2024-08-06:
    input-per-mtok: 2.50
    cached-input-per-mtok: 1.25
    output-per-mtok: 10.00
  claude-haiku-4-5-20251001:
    input-per-mtok: 1.00
    cached-input-per-mtok: 0.10
    cache-write-per-mtok: 2.00
    output-per-mtok: 5.00
  claude-sonnet-4-6:
    input-per-mtok: 3.00
    cached-input-per-mtok: 0.30
    cache-write-per-mtok: 6.00
    output-per-mtok: 15.00
