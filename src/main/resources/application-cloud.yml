# ========================================
# PERFIL: cloud  (Railway)
# ========================================
server:
  port: 8080
spring:
  config:
    activate:
      on-profile: cloud

  # ----------------------------------------
  # DATABASE — Railway Postgres
  #
  # Variáveis injetadas automaticamente pelo serviço Postgres do Railway:
  #   PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE, DATABASE_URL
  # ----------------------------------------
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/menthoros}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5        # Railway free tier limita conexões simultâneas
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ----------------------------------------
  # JPA / HIBERNATE
  # ----------------------------------------
  jpa:
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none              # Flyway gerencia o schema

  # ----------------------------------------
  # FLYWAY
  # ----------------------------------------
  flyway:
    enabled: true

  # ----------------------------------------
  # CACHE — Caffeine (sem Redis no Railway por padrão)
  # ----------------------------------------
  cache:
    type: caffeine

  # ----------------------------------------
  # OAUTH2 / SECURITY — Keycloak Railway
  # ----------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.menthoros.com/realms/menthoros}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://auth.menthoros.com/realms/menthoros/protocol/openid-connect/certs}

# ========================================
# LOGGING
# ========================================
logging:
  level:
    root: warn
    "[org.hibernate.SQL]": off
    "[org.hibernate.type.descriptor.sql.BasicBinder]": off
    "[org.hibernate.orm.jdbc.bind]": off
    "[org.springframework.orm.jpa]": warn
    "[org.springframework.transaction]": warn
    "[com.zaxxer.hikari]": warn

  # ----------------------------------------
  # SMTP — e-mail transacional do backend (Resend, porta 2587/STARTTLS)
  #
  # SEM default em SMTP_HOST de proposito: na nuvem, faltar SMTP deve
  # derrubar o startup, nao degradar para arquivo/log (o link do convite
  # carrega um segredo). Valores por referencia as KC_SMTP_* do Keycloak.
  # ----------------------------------------
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:2587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
